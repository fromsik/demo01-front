<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeBox Planner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>TimeBox Planner</h1>
      <div id="authStatus" class="auth-status"></div>
    </header>

    <main id="app"></main>

    <template id="landingTemplate">
      <section class="card">
        <h2>하루를 시간 블록으로 설계하세요</h2>
        <p>
          핵심 목표(1~5개)와 10분 단위 시간 블록으로 오늘 계획을 작성하고,
          템플릿으로 반복 사용하세요.
        </p>
      </section>

      <section class="card">
        <h3>웹 로그인</h3>
        <p>웹은 로그인 후 작성/저장/조회가 가능합니다.</p>
        <div class="provider-buttons">
          <button data-login="GOOGLE">Google 로그인</button>
          <button data-login="KAKAO">Kakao 로그인</button>
          <button data-login="NAVER">Naver 로그인</button>
        </div>
      </section>

      <section class="card">
        <h3>앱 로컬 모드 체험</h3>
        <p>
          로그인 없이 로컬 저장으로 바로 시작할 수 있습니다. (이 데모에서는 브라우저
          localStorage를 사용)
        </p>
        <button id="enterLocalMode">로그인 없이 시작하기</button>
      </section>
    </template>

    <template id="plannerTemplate">
      <nav class="tabs">
        <button data-tab="today" class="active">오늘 계획</button>
        <button data-tab="templates">양식 관리</button>
        <button data-tab="history">기록 조회</button>
      </nav>

      <section id="modeNotice" class="notice hidden"></section>

      <section id="todayTab" class="tab-panel"></section>
      <section id="templatesTab" class="tab-panel hidden"></section>
      <section id="historyTab" class="tab-panel hidden"></section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
